default:
  image: code.waarp.fr:5000/oci/build-base:latest
  # The runner takes one job at a time, so a superseded pipeline holds the
  # queue. Publishing jobs opt out individually.
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  VERSION: "${CI_COMMIT_TAG}"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  LATEST_IMAGE_TAG: $CI_REGISTRY_IMAGE:latest
  # Transit tag: the image is published under this name during the build stage
  # and only re-tagged with the version once the verify stage has passed. It
  # deliberately carries no version number, so a failed verification cannot
  # leave a :$CI_COMMIT_TAG image behind in the registry.
  #
  # These tags are reclaimed by a registry cleanup policy matching ^ci-\d+$;
  # nothing in the pipeline deletes them.
  STAGING_IMAGE_TAG: $CI_REGISTRY_IMAGE:ci-$CI_PIPELINE_ID
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/waarp-gateway/${VERSION}"
  PACKAGE_DEB: "waarp-gateway_${VERSION}-1_amd64.deb"
  PACKAGE_RPM: "waarp-gateway-${VERSION}-1.x86_64.rpm"
  PACKAGE_LIN: "waarp-gateway-${VERSION}.linux.tar.gz"
  PACKAGE_WIN: "waarp-gateway-${VERSION}.windows.zip"
  PACKAGE_DOC: "waarp-gateway-doc-${VERSION}.zip"
  GOPATH: "$CI_PROJECT_DIR/.cache/gopath"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/gomod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/gobuild"
  GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci"
  CACHE_COMPRESSION_LEVEL: "fastest"

stages:
  - test
  - build
  - verify
  - upload
  - release

# Anchors for the two Go caches. Kept in a hidden job so they are ordinary
# "cache:" entries, valid wherever they are referenced.
.go-cache-anchors:
  cache:
    # Read-only everywhere: "warm-deps" is the only writer. Keyed on go.sum so
    # a dependency bump starts a fresh entry.
    - &cache_gomod
      key:
        files: [ go.sum ]
        prefix: gomod
      paths: [ .cache/gomod ]
      policy: pull
    # One key per job: lint, "-covermode atomic" and the static netgo builds
    # produce disjoint entries.
    # Shared across branches, since the Go build cache is content-addressed and
    # discards what it has not used for five days.
    - &cache_gobuild
      key: "gobuild-$CI_JOB_NAME"
      paths: [ .cache/gobuild ]
      when: always

# Sole writer of the module cache.
warm-deps:
  stage: .pre
  rules:
    - changes: [ go.sum ]
  script:
    - go mod download
  cache:
    - <<: *cache_gomod
      policy: pull-push

lint:
  stage: test
  script:
    - go tool golangci-lint cache status
    - go tool golangci-lint run --timeout 15m --output.junit-xml.path lint.junit.xml --output.text.path stdout --output.code-climate.path=gl-code-quality-report.json
  cache:
    - *cache_gomod
    - *cache_gobuild
    # A fixed key: golangci-lint indexes by content hash, so sharing across
    # branches is safe.
    - key: golangci-lint
      paths:
        - $GOLANGCI_LINT_CACHE
      when: always
  artifacts:
    reports:
      junit: lint.junit.xml
      codequality: gl-code-quality-report.json

tests:
  stage: test
  script:
    - gotestsum --junitfile tests.junit.xml --rerun-fails --format-icons hivis --packages ./... -- -coverprofile=coverage.txt -covermode atomic -shuffle on
  after_script:
    - gocover-cobertura < coverage.txt > coverage.xml
    - go tool cover -func=coverage.txt | grep "total:"
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+\%)/'
  cache:
    - *cache_gomod
    - *cache_gobuild
  artifacts:
    reports:
      junit: tests.junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

compile:
  stage: build
  except: [ tags ]
  script:
    - ./make.sh build dist
    - ./make.sh package deb rpm
  artifacts:
    paths:
      - build/*.deb
      - build/*.rpm
    expire_in: 1 day
  cache:
    - *cache_gomod
    - *cache_gobuild

package:
  stage: build
  # Publishes a transit image tag, so it must not be cancelled mid-push.
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
    # Exercises the image build from a manual pipeline without tagging: only
    # the transit tag is produced, since the upload jobs are tag-only.
    - if: $BUILD_PACKAGES_TEST
  script:
    - ./make.sh build dist
    - export IMAGE_TAG="$STAGING_IMAGE_TAG"
    - ./make.sh package
    - echo "$CI_JOB_TOKEN" | podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - podman push "$STAGING_IMAGE_TAG"
  after_script:
    - export FULLVERSION=$(git describe --tags --abbrev=0)
    - echo VERSION=${FULLVERSION#v} >>version.env
    - ls build/
  cache:
    - *cache_gomod
    - *cache_gobuild
  artifacts:
    paths:
      - build/*.rpm
      - build/*.deb
      - build/*.zip
      - build/*.tar.gz
    reports:
      dotenv: version.env

.check-packages:
  stage: verify
  variables:
    WAARP_CHECK_INNER: "1"
  needs:
    - job: compile
      optional: true
    - job: package
      optional: true
  # Each rule pairs with the job that produces the packages, so the two can
  # never drift apart into a producer-less run.
  rules:
    # Tags: "package" builds them, and a release is verified whatever the diff.
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # Everything else: "compile" builds them (it is "except: [tags]"), and the
    # checks only earn their keep when something that shapes a package moved.
    #
    # The list is wider than dist/ on purpose. The manifest pulls the MIB out
    # of doc/, make.sh drives nfpm, VERSION names the files the script looks
    # for, and the shipped transferd.ini is generated by the daemon itself --
    # so a change under pkg/conf can alter a conffile with dist/ untouched.
    # That last one is the gap this list knowingly leaves open; widening it to
    # pkg/ would mean running the checks on nearly every merge request.
    - changes:
        - dist/*
        - dist/**/*
        - make.sh
        - VERSION
        - doc/source/reference/waarp-transfer.mib
        - .gitlab-ci.yml

# The linters are installed by the script itself, so that these jobs and a
# developer's local run share one command instead of two copies that drift.
check-packages-deb:
  extends: .check-packages
  image: docker.io/library/debian:stable-slim
  script:
    - ./dist/check-packages.sh deb

check-packages-rpm:
  extends: .check-packages
  image: docker.io/library/rockylinux:9
  script:
    - ./dist/check-packages.sh rpm

upload-packages:
  stage: upload
  image: curlimages/curl:latest
  # Tag-only, and it writes to the package registry: never cancel it.
  interruptible: false
  variables:
    # Only the artifacts of the package job are needed, never the sources.
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/${PACKAGE_DEB} ${PACKAGE_REGISTRY_URL}/${PACKAGE_DEB}
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/${PACKAGE_RPM} ${PACKAGE_REGISTRY_URL}/${PACKAGE_RPM}
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/${PACKAGE_LIN} ${PACKAGE_REGISTRY_URL}/${PACKAGE_LIN}
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/${PACKAGE_WIN} ${PACKAGE_REGISTRY_URL}/${PACKAGE_WIN}
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/${PACKAGE_DOC} ${PACKAGE_REGISTRY_URL}/${PACKAGE_DOC}

upload-docker:
  image:
    name: quay.io/skopeo/stable:latest
    # The image's entrypoint is skopeo itself, so the runner's shell would be
    # passed to it as arguments.
    entrypoint: [ "" ]
  stage: upload
  # Moves the released tags in the registry: never cancel it.
  interruptible: false
  variables:
    # The job only moves tags in the registry; it never reads the sources.
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "$CI_JOB_TOKEN" | skopeo login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - skopeo copy --all "docker://$STAGING_IMAGE_TAG" "docker://$IMAGE_TAG"
    - skopeo copy --all "docker://$STAGING_IMAGE_TAG" "docker://$LATEST_IMAGE_TAG"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  # Creates the GitLab release: never cancel it.
  interruptible: false
  variables:
    # release-cli only talks to the API, with variables the runner provides.
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      release-cli create \
        --name "${CI_COMMIT_TAG}" \
        --tag-name $CI_COMMIT_TAG \
        --milestone $CI_COMMIT_TAG \
        --released-at "$CI_COMMIT_TIMESTAMP" \
        --description "${CI_COMMIT_MESSAGE}" \
        --assets-link "{\"name\":\"${PACKAGE_DEB}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${PACKAGE_DEB}\"}" \
        --assets-link "{\"name\":\"${PACKAGE_RPM}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${PACKAGE_RPM}\"}" \
        --assets-link "{\"name\":\"${PACKAGE_LIN}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${PACKAGE_LIN}\"}" \
        --assets-link "{\"name\":\"${PACKAGE_WIN}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${PACKAGE_WIN}\"}" \
        --assets-link "{\"name\":\"${PACKAGE_DOC}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${PACKAGE_DOC}\"}"

