# Translation catalogue of the web interface: one file, French and English side by side, keys nested by
# screen. The common strings of the GUI kit (nav.home, nav.skip, action.*, state.*, header.*...) are merged in
# when the catalogue is loaded: they are not repeated here. Parameters are written {name}.

# Sidebar: the sections and the screens, in the order of the screen map.
nav:
  connections: { fr: Connexions, en: Connections }
  servers: { fr: Serveurs locaux, en: Local servers }
  clients: { fr: Clients locaux, en: Local clients }
  partners: { fr: Partenaires distants, en: Remote partners }
  treatments: { fr: Traitements, en: Processing }
  rules: { fr: Règles de transfert, en: Transfer rules }
  keys: { fr: Clés cryptographiques, en: Cryptographic keys }
  smtp: { fr: Identifiants SMTP, en: SMTP credentials }
  email_templates: { fr: Modèles d'e-mail, en: Email templates }
  supervision: { fr: Supervision, en: Monitoring }
  services: { fr: État des services, en: Service status }
  transfers: { fr: Suivi des transferts, en: Transfer monitoring }
  administration: { fr: Administration, en: Administration }
  users: { fr: Utilisateurs, en: Users }
  authorities: { fr: Autorités d'authentification, en: Authentication authorities }
  clouds: { fr: Instances cloud, en: Cloud instances }
  snmp: { fr: SNMP, en: SNMP }
  overrides: { fr: Surcharges de configuration, en: Configuration overrides }
  footer: { fr: "{product} {version} · révision {revision}", en: "{product} {version} · revision {revision}" }

# Screen "Service status" (Supervision).
services:
  title: { fr: État des services, en: Service status }
  live: { fr: "Actualisé à {time} · toutes les {seconds} s", en: "Updated at {time} · every {seconds} s" }
  refreshing: { fr: Actualisation…, en: Refreshing… }
  groups: { fr: Groupes de services, en: Service groups }
  group:
    core: { fr: Services système, en: System services }
    servers: { fr: Serveurs locaux, en: Local servers }
    clients: { fr: Clients locaux, en: Local clients }
  caption:
    core: { fr: État de chaque service système de la passerelle, en: State of each system service of the gateway }
    servers: { fr: État de chaque serveur local, en: State of each local server }
    clients: { fr: État de chaque client local, en: State of each local client }
    page: { fr: "{caption}, page {page} sur {pages}", en: "{caption}, page {page} of {pages}" }
  col:
    core: { fr: Service système, en: System service }
    server: { fr: Serveur local, en: Local server }
    client: { fr: Client local, en: Local client }
    state: { fr: État, en: Status }
    reason: { fr: Raison, en: Reason }
  reason:
    none: { fr: Aucune raison, en: No reason }
  summary:
    running: { fr: "{running} / {total} en ligne", en: "{running} / {total} running" }
    errors: { fr: "{n} en erreur", en: "{n} in error" }
    offline: { fr: "{n} hors ligne", en: "{n} offline" }
    unknown: { fr: "{n} inconnu", en: "{n} unknown" }
  pager:
    info: { fr: "{group} {from} à {to} sur {total}", en: "{group} {from} to {to} of {total}" }
  # Functional names of the system services, keyed by their technical name; a service without an entry
  # keeps its technical name.
  core:
    Admin: { fr: Administration (API REST et interface web), en: Administration (REST API and web interface) }
    Analytics: { fr: Statistiques internes, en: Internal metrics }
    Controller: { fr: Contrôleur des transferts, en: Transfer controller }
    Database: { fr: Base de données, en: Database }
    SNMP: { fr: Agent SNMP, en: SNMP agent }
  empty:
    servers:
      title: { fr: Aucun serveur local pour l'instant, en: No local server yet }
      text:
        fr: "Un serveur local est un point d'écoute de la passerelle pour un protocole. Il apparaît ici dès sa création."
        en: "A local server is a listening endpoint of the gateway for one protocol. It appears here as soon as it is created."
      link: { fr: Voir les serveurs locaux, en: See local servers }
    clients:
      title: { fr: Aucun client local pour l'instant, en: No local client yet }
      text:
        fr: "Un client local est l'identité sortante de la passerelle pour un protocole. Il apparaît ici dès sa création."
        en: "A local client is the outgoing identity of the gateway for one protocol. It appears here as soon as it is created."
      link: { fr: Voir les clients locaux, en: See local clients }
  error:
    title: { fr: Les états n'ont pas pu être actualisés., en: The states could not be refreshed. }
    text:
      fr: "Dernière lecture réussie à {time}. Les états affichés datent de cette lecture ; une nouvelle tentative a lieu toutes les {seconds} s."
      en: "Last successful read at {time}. The states shown date from that read; a new attempt is made every {seconds} s."
