# Catalogue of the web interface, English. One file per language (decision of 2026-10-18): fr.yaml and en.yaml
# carry the same key tree in the same order; the catalogue test checks the parity. The common strings of the
# GUI kit (nav.home, nav.skip, action.*, state.*, header.*...) are merged in when the catalogue is loaded: they
# are not repeated here. Parameters: {name}.

# Sidebar: the sections and the screens, in the order of the screen map.
nav:
  connections: Connections
  servers: Local servers
  clients: Local clients
  partners: Remote partners
  treatments: Processing
  rules: Transfer rules
  keys: Cryptographic keys
  smtp: SMTP credentials
  email_templates: Email templates
  supervision: Monitoring
  services: Service status
  transfers: Transfer monitoring
  administration: Administration
  users: Users
  authorities: Authentication authorities
  clouds: Cloud instances
  snmp: SNMP
  overrides: Configuration overrides
  footer: "{product} {version}"

# Screen "Service status" (Monitoring).
services:
  title: Service status
  live: "Updated at {time}"
  refreshing: Refreshing…
  groups: Service groups
  group:
    core: System services
    servers: Local servers
    clients: Local clients
  caption:
    core: State of each system service of the gateway
    servers: State of each local server
    clients: State of each local client
    page: "{caption}, page {page} of {pages}"
  col:
    core: System service
    server: Local server
    client: Local client
    state: Status
    reason: Reason
  reason:
    none: No reason
  summary:
    running: "{running} / {total} running"
    errors: "{n} in error"
    offline: "{n} offline"
    unknown: "{n} unknown"
  pager:
    info: "{group} {from} to {to} of {total}"
  # Functional names of the system services, keyed by their technical name; a service without an entry keeps
  # its technical name.
  core:
    Admin: Administration (REST API and web interface)
    Analytics: Internal metrics
    Controller: Transfer controller
    Database: Database
    SNMP: SNMP agent
  empty:
    servers:
      title: No local server yet
      text: "A local server is a listening endpoint of the gateway for one protocol. It appears here as soon as it is created."
      link: See local servers
    clients:
      title: No local client yet
      text: "A local client is the outgoing identity of the gateway for one protocol. It appears here as soon as it is created."
      link: See local clients
  error:
    title: The states could not be refreshed.
    text: "Last successful read at {time}. The states shown date from that read; a new attempt is made every {seconds} s."

# Protocols, shared by the local servers, the local clients and the remote partners: the family (R66, HTTP,
# SFTP, FTP, PeSIT, WebDAV, AS2), TLS as an attribute at the screen (Driss, 2026-10-19; the product keeps one
# key per variant), the options of each family.
proto:
  label: Protocol
  choose: Choose a protocol
  choose_hint: The options of the protocol appear after the choice.
  choose_error: Choose a protocol.
  tls: Secure the connection with TLS
  tls_hint: "Offered for the protocols that exist with and without TLS; SFTP is secured by SSH"
  tls_title: TLS encryption
  tls_badge: TLS
  described_tls: "{family}, secured by TLS ({name})"
  filter_tls: TLS encryption
  filter_tls_all: With or without TLS
  filter_tls_yes: With TLS
  filter_tls_no: Without TLS
  options: "{protocol} options"
  options_label: Options
  error_number: Enter a whole number.
  error_duration: "Give whole numbers of hours, minutes and seconds."
  options_default: Default options of the gateway
  options_set_one: 1 option set
  options_set: "{n} options set"
  tls_summary: "{version} · {suites}"
  tls_suite_one: 1 suite chosen
  tls_suites: "{n} suites chosen"
  # Options by family: the effect for the operator first, the technical term as a monospace hint.
  duration:
    hours: Hours
    minutes: Minutes
    seconds: Seconds
    h: h
    min: min
    s: s
  # Themes of the cards of options, when the family names two at least.
  section:
    identity: Identification
    sync: Restart and synchronisation
    messages: Messages
    ack: Acknowledgement
    transfer: Transfer
    integrity: Integrity checks
    modes: Connection modes
    algorithms: Algorithms
    compat: Compatibility
    security: Signature and encryption
    mdn: Asynchronous MDN
    other: Other options
  opt:
    r66_login: Login expected from the partner
    r66_login_hint: "By default, the name of the server"
    r66_block: Size of a data block
    r66_block_hint: "In bytes; 65,536 by default"
    r66_no_final_hash: Do not check the hash at the end of the transfer
    r66_check_block_hash: Check the hash of every block
    r66_final_hash: Hash at the end of the transfer
    r66_block_hash: Hash of every block
    min_tls: Minimum TLS version
    min_tls_hint: "Cipher suites are chosen up to TLS 1.2; in TLS 1.3 the library sets them."
    tls_ciphers: "TLS cipher suites, up to TLS 1.2"
    tls_ciphers_short: TLS cipher suites
    tls_ciphers_hint: "Empty: every secure suite of the gateway is accepted when negotiating with the partner. A suite flagged insecure is only added knowingly."
    tls_insecure: (insecure)
    algo_historic: (historic)
    algo_disabled: (disabled by default)
    ftp_disable_passive: Disable the passive mode
    ftp_disable_active: Disable the active mode
    ftp_passive: Passive mode
    ftp_active: Active mode
    ftp_passive_min: First port of the passive mode
    any_port_hint: "Empty: any free port"
    ftp_passive_max: Last port of the passive mode
    tls_requirement: TLS requirement
    tls_requirements:
      optional: Optional explicit TLS
      mandatory: Mandatory explicit TLS
      implicit: Implicit TLS
    pesit_disable_restart: Disable the restart of interrupted transfers
    pesit_disable_checkpoints: Disable the checkpoints
    pesit_restart: Restart of interrupted transfers
    pesit_checkpoints: Checkpoints
    pesit_checkpoint_size: Interval between two checkpoints
    pesit_checkpoint_window: Checkpoints without acknowledgement
    pesit_checkpoint_window_hint: "Window, in number of checkpoints"
    pesit_max_message: Maximum size of a message
    pesit_mode: PeSIT mode
    pesit_mode_hint: "“Standard” follows the published specification; “Non standard” follows the market convention some partners expect."
    pesit_modes:
      standard: Standard
      non_standard: Non standard
    pesit_disable_preconnection: Disable the pre-connection
    pesit_preconnection: Pre-connection
    sftp_note: "An empty list accepts every algorithm of the gateway; the order of the chosen ones is the preference order."
    sftp_kex: Key exchange algorithms
    sftp_kex_hint: "Empty: every key exchange algorithm is accepted"
    sftp_ciphers: Cipher algorithms
    sftp_ciphers_hint: "Empty: every cipher algorithm is accepted"
    sftp_macs: Integrity algorithms
    sftp_macs_hint: "Empty: every integrity algorithm is accepted"
    as2_max_file_size: Maximum size of a file
    as2_max_file_size_hint: "In bytes; cannot exceed the memory of the system"
    as2_mdn_algo: Signature of the MDN acknowledgements
    mdn:
      none: No signature
    bytes: In bytes
    enabled: Enabled
    disabled: Disabled
    checked: Checked
    unchecked: Not checked
    default_login: The name of the server
    default_block: "65,536 bytes"
    default_value: Default value of the gateway
    default_ciphers: Every secure suite of the gateway
    default_algos: Every algorithm of the gateway
    any_port: Any free port
    none: No option for this protocol
    r66_final_hash_algo: Hash algorithm at the end of the transfer
    r66_final_hash_algo_hint: "SHA-256 by default"
    ftp_enable_active: Enable the active mode
    ftp_active_address: Active mode address
    ftp_active_address_hint: "Local IP address announced to the server; empty: 0.0.0.0"
    ftp_active_min: First port of the active mode
    ftp_active_max: Last port of the active mode
    default_active_address: "0.0.0.0"
    # Options of a remote partner (#714): what the client of its protocol reads from the partner.
    r66_server_login: Login presented by the server
    r66_server_login_hint: "By default, the name of the partner"
    default_partner_login: The name of the partner
    ftp_disable_epsv: Disable EPSV
    ftp_epsv: EPSV
    ftp_implicit_tls: Implicit TLS
    ftp_implicit_tls_hint: "By default, explicit TLS (\"AUTH TLS\" after the connection)"
    ftp_no_session_reuse: Disable the TLS session reuse
    ftp_session_reuse: TLS session reuse
    pesit_login: Login of the partner
    pesit_login_hint: "Empty: the partner is not authenticated; its password is a \"Password\" means of the partner"
    pesit_login_none: Not authenticated
    tristate:
      client: As the client (default)
      on: Enabled
      off: Disabled
    pesit_nsdu: Use NSDU packets
    pesit_nsdu_hint: Enabled by default
    pesit_expects_ack: Expects an acknowledgement of received transfers
    pesit_ack_timeout: Acknowledgement timeout
    pesit_ack_timeout_hint: "When an acknowledgement is expected; empty: no limit"
    pesit_ack_no_limit: No limit
    pesit_no_pi37: Do not send the PI 37
    pesit_pi37: Sending of the PI 37
    sftp_use_stat: Read the size of the file before receiving it
    sftp_no_concurrent_reads: Disable concurrent reads
    sftp_no_concurrent_reads_hint: "By default, a received file is read by several readers at once"
    sftp_concurrent_reads: Concurrent reads
    as2_sign_algo: Signature algorithm
    as2_encrypt_algo: Encryption algorithm
    as2_async_mdn: Address of the asynchronous MDNs
    as2_async_mdn_hint: "Empty: no asynchronous MDN"
    as2_async_mdn_none: No asynchronous MDN
    as2_handle_async_mdn: Handle the asynchronous MDNs
    as2_handle_async_mdn_hint: "The gateway receives them itself; otherwise a third-party service handles them"

