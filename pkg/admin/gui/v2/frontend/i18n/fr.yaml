# Catalogue de l'interface web, français. Un fichier par langue (décision de Driss du 18/10/2026) : fr.yaml et
# en.yaml portent la même arborescence de clés, dans le même ordre ; le test du catalogue vérifie la parité.
# Les chaînes communes du kit GUI (nav.home, nav.skip, action.*, state.*, header.*…) sont fusionnées au
# chargement : elles ne sont pas répétées ici. Paramètres : {nom}.

# Barre latérale : les sections et les écrans, dans l'ordre de la carte des écrans.
nav:
  connections: Connexions
  servers: Serveurs locaux
  clients: Clients locaux
  partners: Partenaires distants
  treatments: Traitements
  rules: Règles de transfert
  keys: Clés cryptographiques
  smtp: Identifiants SMTP
  email_templates: Modèles d'e-mail
  supervision: Supervision
  services: État des services
  transfers: Suivi des transferts
  administration: Administration
  users: Utilisateurs
  authorities: Autorités d'authentification
  clouds: Instances cloud
  snmp: SNMP
  overrides: Surcharges de configuration
  footer: "{product} {version}"

# Écran « État des services » (Supervision).
services:
  title: État des services
  live: "Actualisé à {time}"
  refreshing: Actualisation…
  groups: Groupes de services
  group:
    core: Services système
    servers: Serveurs locaux
    clients: Clients locaux
  caption:
    core: État de chaque service système de la passerelle
    servers: État de chaque serveur local
    clients: État de chaque client local
    page: "{caption}, page {page} sur {pages}"
  col:
    core: Service système
    server: Serveur local
    client: Client local
    state: État
    reason: Raison
  reason:
    none: Aucune raison
  summary:
    running: "{running} / {total} en ligne"
    errors: "{n} en erreur"
    offline: "{n} hors ligne"
    unknown: "{n} inconnu"
  pager:
    info: "{group} {from} à {to} sur {total}"
  # Noms fonctionnels des services système, par nom technique ; un service sans entrée garde son nom technique.
  core:
    Admin: Administration (API REST et interface web)
    Analytics: Statistiques internes
    Controller: Contrôleur des transferts
    Database: Base de données
    SNMP: Agent SNMP
  empty:
    servers:
      title: Aucun serveur local pour l'instant
      text: "Un serveur local est un point d'écoute de la passerelle pour un protocole. Il apparaît ici dès sa création."
      link: Voir les serveurs locaux
    clients:
      title: Aucun client local pour l'instant
      text: "Un client local est l'identité sortante de la passerelle pour un protocole. Il apparaît ici dès sa création."
      link: Voir les clients locaux
  error:
    title: Les états n'ont pas pu être actualisés.
    text: "Dernière lecture réussie à {time}. Les états affichés datent de cette lecture ; une nouvelle tentative a lieu toutes les {seconds} s."

# Protocoles, partagés par les serveurs locaux, les clients locaux et les partenaires distants : la famille
# (R66, HTTP, SFTP, FTP, PeSIT, WebDAV, AS2), TLS comme attribut à l'écran (Driss, 19/10/2026 ; le produit
# garde une clé par variante), les options de chaque famille.
proto:
  label: Protocole
  choose: Choisissez un protocole
  choose_hint: Les options du protocole apparaissent après le choix.
  choose_error: Choisissez un protocole.
  tls: Chiffrer la connexion par TLS
  tls_hint: "Proposé pour les protocoles qui existent avec et sans TLS ; SFTP est chiffré par SSH"
  tls_title: Chiffrement TLS
  tls_badge: TLS
  described_tls: "{family}, chiffré par TLS ({name})"
  filter_tls: Chiffrement TLS
  filter_tls_all: Avec ou sans TLS
  filter_tls_yes: Avec TLS
  filter_tls_no: Sans TLS
  options: "Options du protocole {protocol}"
  options_label: Options
  error_number: Indiquez un nombre entier.
  # Options par famille : l'effet pour l'exploitant d'abord, le terme technique en aide monospace.
  opt:
    r66_login: Identifiant attendu du partenaire
    r66_login_hint: "Par défaut, le nom du serveur"
    r66_block: Taille d'un bloc de données
    r66_block_hint: "En octets ; 65 536 par défaut"
    r66_no_final_hash: Ne pas vérifier le hachage en fin de transfert
    r66_check_block_hash: Vérifier le hachage de chaque bloc
    r66_final_hash: Hachage en fin de transfert
    r66_block_hash: Hachage de chaque bloc
    min_tls: Version TLS minimale
    min_tls_hint: "Les suites de chiffrement se choisissent jusqu'à TLS 1.2 ; en TLS 1.3, la bibliothèque les fixe."
    tls_ciphers: "Suites de chiffrement TLS, jusqu'à TLS 1.2"
    tls_ciphers_short: Suites de chiffrement TLS
    tls_ciphers_hint: "Vide : toutes les suites sûres de la passerelle sont acceptées lors de la négociation avec le partenaire. Une suite marquée « non sécurisée » ne s'ajoute qu'en connaissance de cause."
    tls_insecure: (non sécurisée)
    ftp_disable_passive: Désactiver le mode passif
    ftp_disable_active: Désactiver le mode actif
    ftp_passive: Mode passif
    ftp_active: Mode actif
    ftp_passive_min: Premier port du mode passif
    any_port_hint: "Vide : n'importe quel port libre"
    ftp_passive_max: Dernier port du mode passif
    tls_requirement: Exigence TLS
    tls_requirements:
      optional: TLS explicite facultatif
      mandatory: TLS explicite obligatoire
      implicit: TLS implicite
    pesit_disable_restart: Désactiver la reprise des transferts interrompus
    pesit_disable_checkpoints: Désactiver les points de synchronisation
    pesit_restart: Reprise des transferts interrompus
    pesit_checkpoints: Points de synchronisation
    pesit_checkpoint_size: Intervalle entre deux points de synchronisation
    pesit_checkpoint_window: Points de synchronisation sans acquittement
    pesit_checkpoint_window_hint: "Fenêtre, en nombre de points"
    pesit_max_message: Taille maximale d'un message
    pesit_mode: Mode PeSIT
    pesit_mode_hint: "« Standard » suit la spécification publiée ; « Non standard » suit la convention du marché attendue par certains partenaires."
    pesit_modes:
      standard: Standard
      non_standard: Non standard
    pesit_disable_preconnection: Désactiver la pré-connexion
    pesit_preconnection: Pré-connexion
    sftp_note: "Une liste vide accepte tous les algorithmes de la passerelle ; l'ordre des retenus est l'ordre de préférence."
    sftp_kex: Algorithmes d'échange de clés
    sftp_kex_hint: "Vide : tous les algorithmes d'échange de clés sont acceptés"
    sftp_ciphers: Algorithmes de chiffrement
    sftp_ciphers_hint: "Vide : tous les algorithmes de chiffrement sont acceptés"
    sftp_macs: Algorithmes d'intégrité
    sftp_macs_hint: "Vide : tous les algorithmes d'intégrité sont acceptés"
    as2_max_file_size: Taille maximale d'un fichier
    as2_max_file_size_hint: "En octets ; ne peut pas dépasser la mémoire du système"
    as2_mdn_algo: Signature des accusés MDN
    mdn:
      none: Aucune signature
    bytes: En octets
    enabled: Activé
    disabled: Désactivé
    checked: Vérifié
    unchecked: Non vérifié
    default_login: Le nom du serveur
    default_block: "65 536 octets"
    default_value: Valeur par défaut de la passerelle
    default_ciphers: Toutes les suites sûres de la passerelle
    default_algos: Tous les algorithmes de la passerelle
    any_port: N'importe quel port libre
    none: Aucune option pour ce protocole
    r66_final_hash_algo: Algorithme du hachage en fin de transfert
    r66_final_hash_algo_hint: "SHA-256 par défaut"
    ftp_enable_active: Activer le mode actif
    ftp_active_address: Adresse du mode actif
    ftp_active_address_hint: "Adresse IP locale annoncée au serveur ; vide : 0.0.0.0"
    ftp_active_min: Premier port du mode actif
    ftp_active_max: Dernier port du mode actif
    default_active_address: "0.0.0.0"

