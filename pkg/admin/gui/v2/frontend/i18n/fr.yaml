    identity: Identification
    sync: Reprise et synchronisation
    messages: Messages
    ack: Acquittement
    transfer: Transfert
    integrity: Contrôle d'intégrité
    modes: Modes de connexion
    algorithms: Algorithmes
    compat: Compatibilité
    security: Signature et chiffrement
    mdn: MDN asynchrone
