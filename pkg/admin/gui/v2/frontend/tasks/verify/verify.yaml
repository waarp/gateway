description:
  en: >
    Verify that the transfer file matches the cryptographic signature in the given
    file and was made with the provided key.
  fr: >
    Vérifie que le fichier de transfert correspond à la signature cryptographique
    donnée et que celle-ci a bien été faite avec la clé fournie.

signatureFile:
  en: Signature file
  fr: Fichier de signature

signatureFileTooltip:
  en: The file containing the signature to verify.
  fr: Le fichier contenant la signature à vérifier.

method:
  en: Signature method
  fr: Méthode de signature

methodTooltip:
  en: The signature method used.
  fr: La méthode de signature utilisée.

methodPlaceholder:
  en: Choose an algorithm
  fr: Choisir un algorithme

keyName:
  en: Verification key
  fr: Clé de vérification

keyNameTooltip:
  en: The key to use for verifying the signature. Must have been previously registered.
  fr: La clé à utiliser pour vérifier la signature. Doit avoir été préalablement enregistrée.

keyNamePlaceholder:
  en: Choose a key
  fr: Choisir une clé