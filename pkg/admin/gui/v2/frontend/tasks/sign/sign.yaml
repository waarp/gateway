description:
  en: Make a cryptographic signature of the transfer file using the provided key.
  fr: Crée une signature cryptographique du fichier de transfert avec la clé donnée.

outputFile:
  en: Output file
  fr: Fichier de sortie

outputFileTooltip:
  en: >
    The file to which the signature will be written. By default, the signature 
    will be written to the a file with the same name as the transfer file with
    the ".sig" extension added at the end.
  fr: >
    Le fichier dans lequel la signature sera écrite. Par défaut, la signature
    sera écrite dans un fichier avec le même nom que le fichier de transfert, 
    avec l'extension ".sig" ajoutée à la fin.

method:
  en: Signature method
  fr: Méthode de signature

methodTooltip:
  en: The signature method to use.
  fr: La méthode de signature à utiliser.

methodPlaceholder:
  en: Chose an algorithm
  fr: Choisir un algorithme

keyName:
  en: Signature key
  fr: Clé de signature

keyNameTooltip:
  en: The key to use for signing. Must have been previously registered.
  fr: La clé à utiliser pour signer. Doit avoir été préalablement enregistrée.

keyNamePlaceholder:
  en: Choose a key
  fr: Choisir une clé