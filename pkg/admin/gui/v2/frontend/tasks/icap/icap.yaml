description:
  en: Send the transfer file to an Icap server for processing.
  fr: Envoie le fichier de transfert à un serveur Icap pour traitement.

uploadURL:
  en: Upload URL
  fr: URL d'upload

uploadURLTooltip:
  en: The Icap URL to which the transfer file will be uploaded.
  fr: L'URL Icap à laquelle le fichier de transfert sera envoyé.

useTLS:
  en: Use TLS
  fr: Utiliser TLS

useTLSTooltip:
  en: Use TLS when connecting to the Icap server.
  fr: Utiliser TLS en se connectant au serveur Icap.

timeout:
  en: Timeout
  fr: Timeout

timeoutTooltip:
  en: The maximum allowed duration for the task.
  fr: La durée maximale autorisée pour la tâche.
  
allowFileModifications:
  en: Allow file modifications
  fr: Permettre les modifications de fichier

allowFileModificationsTooltip:
  en: >
    Specifies if the Icap server is allowed to modify the file uploaded to it.
    In which case, the modified file will replace the original file.
  fr: >
    Spécifie si le serveur Icap est autorisé à modifier le fichier qui lui est envoyé.
    Dans ce cas, le fichier modifié remplacera le fichier original.

onError:
  en: On error
  fr: En cas d'erreur

onErrorTooltip:
  en: What to do with the file in case the Icap server refuses the file.
  fr: Que faire avec le fichier si le serveur Icap le refuse.

onErrorNothing:
  en: Do nothing
  fr: Ne rien faire

onErrorDelete:
  en: Delete the file
  fr: Supprimer le fichier

onErrorMove:
  en: Move the file
  fr: Déplacer le fichier

onErrorMovePath:
  en: Quarantine path
  fr: Chemin de quarantaine

onErrorMovePathTooltip:
  en: The path to which the file should be move if refused by the server.
  fr: Le chemin où le fichier doit être déplacé si refusé par le serveur.
